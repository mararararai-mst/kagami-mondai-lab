<script>
/* =========================================================
   問題のデータ（座標は方眼のマス。右が x、下が y）
   プリントの図の方眼をそのまま写した（2026-10-26 照合）
   ========================================================= */
const PROBLEMS = [
  { id:'bou', type:'A', title:'鏡と棒　見えない棒はどれ？', src:'鏡のしくみ、反射の法則 p.1',
    cols:12, rows:6,
    mirrors:[{ a:[3,2], b:[6,2], label:'鏡', labelAt:[1.6,1.55] }],
    eye:{ at:[4,3], label:'A' },
    objs:[ {id:'ア', at:[1,3]}, {id:'イ', at:[5,4]}, {id:'ウ', at:[7,3]}, {id:'エ', at:[8,2]}, {id:'オ', at:[11,4]} ],
    objWord:'棒', ask:'A から鏡を見たとき、鏡にうつって<b>見えない棒</b>はどれかな？' },
  { id:'iro', type:'A', title:'色鉛筆　どの色が見える？', src:'鏡のしくみ、反射の法則 p.5',
    cols:9, rows:17,      // 2026-10-26 400dpiで数え直し：横9マス、Oは左はしから1マス目、色鉛筆は右はしの線の上
    mirrors:[{ a:[0,9], b:[6,9], label:'鏡の面', labelAt:[0.2,8.45] }],
    eye:{ at:[1,17], label:'O' },
    objs:[ {id:'赤', at:[9,11], color:'#d0304a'}, {id:'青', at:[9,13], color:'#2f6fc0'},
           {id:'黄', at:[9,15], color:'#e8c020'}, {id:'黒', at:[9,17], color:'#2a2a2a'} ],
    objWord:'色鉛筆', ask:'O から鏡を見たとき、鏡にうつって<b>見える色鉛筆</b>はどれかな？' },
  { id:'zou', type:'A', title:'Bの像と、光の道すじ', src:'鏡のしくみ、反射の法則 p.1',
    cols:16, rows:8,
    mirrors:[{ a:[2,4], b:[14,4], label:'鏡', labelAt:[14.3,3.6] }],
    eye:{ at:[3,7], label:'A' },
    objs:[ {id:'B', at:[13,7]} ],
    objWord:'点', ask:'B から出た光が、鏡ではね返って A に届くまでの<b>道すじ</b>は？' },
  { id:'fukui', type:'A', title:'まち針と2枚の鏡（福井）', src:'鏡のしくみ、反射の法則 p.3', is3d:true, href:'kagami3d.html?p=fukui' },

  /* 型B：光源から出た光をたどる（front＝鏡の表がわにある点。うらに当たった光はそこで止まる） */
  { id:'nagasaki', type:'B', kind:'ray', title:'2枚の鏡で点Pの上へ（長崎）', src:'鏡のしくみ、反射の法則 p.2',
    cols:10, rows:10,
    mirrors:[ { a:[5,10], b:[5,5], front:[6,7], label:'平面鏡A', labelAt:[2.2,10.9] },
              { a:[5,5], b:[10,5], front:[7,6], label:'平面鏡B', labelAt:[8.3,4.5] } ],
    source:{ at:[10,10], dir:[-5,-1], label:'O' },
    targets:[ {id:'ア',at:[5,6],left:true}, {id:'イ',at:[5,7],left:true}, {id:'ウ',at:[5,8],left:true}, {id:'エ',at:[5,9],left:true}, {id:'P',at:[10,6],goal:true} ],
    hint:'光源装置のつまみを回して、平面鏡Aのア〜エに当ててみよう。P の上を通るのはどれかな？' },
  { id:'screen', type:'B', kind:'ray', title:'鏡①②とスクリーン', src:'鏡のしくみ、反射の法則 p.2',
    cols:8, rows:8,
    mirrors:[ { a:[4.1,1.1], b:[5.6,2.6], front:[4,3], label:'鏡①', labelAt:[3.6,0.75] },
              { a:[2,1.6], b:[2,6.5], front:[3,4], label:'鏡②', labelAt:[0.6,1.4] } ],
    walls:[ { a:[8,0.5], b:[8,8], label:'スクリーン', labelAt:[6.3,8.75] } ],
    source:{ at:[10/3,7], dir:[1,-3], label:'' },
    targets:[ {id:'ア',at:[8,3]}, {id:'イ',at:[8,4]}, {id:'ウ',at:[8,5]}, {id:'エ',at:[8,6]} ],
    hint:'光は鏡①、鏡②ではね返って、スクリーンのどこに届くかな？ つまみを回すと光の向きが変わります。' },
  { id:'chokkaku', type:'B', kind:'ray', title:'直角の鏡と光の道すじ（19図）', src:'鏡のしくみ、反射の法則 p.4',
    cols:8, rows:7,
    mirrors:[ { a:[4,1], b:[1,4], front:[4,3], label:'鏡A', labelAt:[0.2,4.75] },
              { a:[4,1], b:[7,4], front:[4,3], label:'鏡B', labelAt:[6.9,4.75] } ],
    source:{ at:[5,5], dir:[0,-1], label:'' },
    targets:[],
    hint:'鏡Bにあたった光は、そのあとどう進むかな？ 光源装置をつかんで左右に動かしてみよう。' },
  { id:'temagami', type:'B', kind:'via2', title:'手鏡で後頭部を見る', src:'鏡発展 p.4',
    cols:20, rows:9,
    mirrors:[ { a:[10,1], b:[10,8], front:[11,5], label:'洗面台の鏡', labelAt:[7.2,8.9] },
              { a:[15,2], b:[19,6], front:[16,5], label:'手鏡', labelAt:[18.4,7.2] } ],
    order:[1,0],
    eye:{ at:[13,6], label:'P' }, objs:[ {id:'Q', at:[15,6]} ],
    hint:'Q（後頭部）から出た光は、手鏡と洗面台の鏡ではね返って P（目）に届きます。P や Q を動かしてみよう。' },

  { id:'moji', type:'C', title:'鏡にうつる文字の向き（L・4）', src:'鏡のしくみ p.4／鏡発展 p.2', is3d:true, href:'moji3d.html' },

  { id:'zenshin', type:'D', kind:'side', title:'全身がうつる鏡', src:'鏡発展 p.1〜3・5',
    hint:'目の高さ・身長・鏡の位置を変えてみよう。鏡からはなれると、見える部分は変わるかな？' },
];
const TYPE_NAME = { A:'上から見た方眼　見える・見えない', B:'光の道すじ　鏡が2枚以上', C:'像の向き', D:'全身鏡　横から見た図' };

/* ---------- ベクトル ---------- */
const sub=(p,q)=>[p[0]-q[0],p[1]-q[1]], addv=(p,q)=>[p[0]+q[0],p[1]+q[1]], mul=(p,k)=>[p[0]*k,p[1]*k];
const dot=(p,q)=>p[0]*q[0]+p[1]*q[1], cross=(p,q)=>p[0]*q[1]-p[1]*q[0];
const near=(p,q)=>Math.abs(p[0]-q[0])<1e-9&&Math.abs(p[1]-q[1])<1e-9;
// 鏡の線について、点の鏡像（対称な点）
function reflect(p,m){ const d=sub(m.b,m.a), L=dot(d,d), t=dot(sub(p,m.a),d)/L, foot=addv(m.a,mul(d,t)); return sub(mul(foot,2),p); }
// 鏡の「表」の向き＝目がいる側。目が鏡の線の上にいるときは 0
function side(p,m){ return Math.sign(cross(sub(m.b,m.a),sub(p,m.a))); }
// 線分どうしの交点（両端をふくむ）。なければ null
function segHit(p1,p2,q1,q2){
  const r=sub(p2,p1), s=sub(q2,q1), den=cross(r,s); if(Math.abs(den)<1e-12) return null;
  const qp=sub(q1,p1), t=cross(qp,s)/den, u=cross(qp,r)/den, e=1e-9;
  if(t<-e||t>1+e||u<-e||u>1+e) return null; return { p:addv(p1,mul(r,t)), t, u };
}
/* 物Qが、目Eから鏡mにうつって見えるか。見えるなら鏡の上の反射点を返す
   ＝Qが目と同じ側にあり、目の像E'とQを結ぶ線が鏡を通るとき */
// 多角形を方眼の四角で切る（Sutherland–Hodgman）
function clipToBoard(poly,W,H){
  const ins=[q=>q[0]>=0,q=>q[0]<=W,q=>q[1]>=0,q=>q[1]<=H];
  const cut=[(a,b)=>atX(a,b,0),(a,b)=>atX(a,b,W),(a,b)=>atY(a,b,0),(a,b)=>atY(a,b,H)];
  function atX(a,b,x){ const t=(x-a[0])/(b[0]-a[0]); return [x,a[1]+(b[1]-a[1])*t]; }
  function atY(a,b,y){ const t=(y-a[1])/(b[1]-a[1]); return [a[0]+(b[0]-a[0])*t,y]; }
  let out=poly;
  ins.forEach((inside,k)=>{ const inp=out; out=[]; for(let i=0;i<inp.length;i++){ const a=inp[i], b=inp[(i+1)%inp.length];
    if(inside(b)){ if(!inside(a)) out.push(cut[k](a,b)); out.push(b); } else if(inside(a)) out.push(cut[k](a,b)); } });
  return out;
}
function onSeg(p,m){ const d=sub(m.b,m.a), t=dot(sub(p,m.a),d)/dot(d,d); return side(p,m)===0 && t>=-1e-9 && t<=1+1e-9; }
function seenVia(E,Q,m){
  const sE=side(E,m), sQ=side(Q,m); if(sE===0||sQ!==sE) return null;
  const h=segHit(reflect(E,m),Q,m.a,m.b); return h ? h.p : null;
}

/* =========================================================
   SVG で描く
   ========================================================= */
const NS='http://www.w3.org/2000/svg';
function el(tag,attrs,parent){ const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); if(parent) parent.appendChild(e); return e; }
const C=10;              // 1マスの大きさ（SVGの単位）
const PAD=6;             // 方眼のまわりの余白（マス）×C ではなく SVG の単位

function drawBoard(svg,P,st,opt){
  svg.innerHTML='';
  const W=P.cols*C, H=P.rows*C;
  svg.setAttribute('viewBox',`${-PAD*3} ${-PAD*3} ${W+PAD*6} ${H+PAD*6}`);
  const X=p=>p[0]*C, Y=p=>p[1]*C;
  const defs=el('defs',{},svg);
  const clip=el('clipPath',{id:'clip-'+opt.uid},defs); el('rect',{x:0,y:0,width:W,height:H},clip);
  const mk=el('marker',{id:'arw-'+opt.uid,viewBox:'0 0 10 10',refX:6,refY:5,markerWidth:3,markerHeight:3,orient:'auto-start-reverse'},defs);
  el('path',{d:'M0,0 L10,5 L0,10 z',fill:'var(--ray)'},mk);

  // 方眼
  const g=el('g',{},svg);
  for(let i=0;i<=P.cols;i++) el('line',{x1:i*C,y1:0,x2:i*C,y2:H,stroke:'var(--grid)','stroke-width':.6},g);
  for(let j=0;j<=P.rows;j++) el('line',{x1:0,y1:j*C,x2:W,y2:j*C,stroke:'var(--grid)','stroke-width':.6},g);

  const E=st.eye, lv=st.hint||0;
  const objs=P.objs.map((o,i)=>({...o, at:st.objs[i]}));
  const seenOf=o=>P.mirrors.some(m=>seenVia(E,o.at,m));
  const front=(o,m)=>side(o.at,m)!==0 && side(o.at,m)===side(E,m);     // 目と同じがわ（鏡の表）にある物だけ像をかく
  const onLine=(o,m)=>side(o.at,m)===0;                                // 鏡の面をのばした線の上の物は、像が自分と重なる
  // ヒント③ 見える範囲（目の像から鏡の両はしを通る2本の線の間）
  if(lv>=3){
    for(const m of P.mirrors){
      if(side(E,m)===0) continue;
      const E2=reflect(E,m), K=60;
      const f1=addv(m.a,mul(sub(m.a,E2),K)), f2=addv(m.b,mul(sub(m.b,E2),K));
      const poly=clipToBoard([m.a,f1,f2,m.b],P.cols,P.rows); if(poly.length<3) continue;
      el('path',{d:'M'+poly.map(q=>`${X(q)},${Y(q)}`).join(' L')+' Z',
        fill:'var(--zone)',stroke:'var(--zone-bd)','stroke-width':.7,'stroke-dasharray':'2 1.5','clip-path':`url(#clip-${opt.uid})`},svg);
    }
  }

  // 鏡（表＝銀、うら＝濃い灰）
  for(const m of P.mirrors){
    const d=sub(m.b,m.a), L=Math.hypot(...d), n=[-d[1]/L,d[0]/L];   // n は鏡の線の左側
    const s=side(E,m)||1, back=mul(n,-s*0.32);                       // うらは目と反対がわ
    const pa=addv(m.a,back), pb=addv(m.b,back);
    el('path',{d:`M${X(m.a)},${Y(m.a)} L${X(m.b)},${Y(m.b)} L${X(pb)},${Y(pb)} L${X(pa)},${Y(pa)} Z`,fill:'var(--mirror-d)'},svg);
    el('line',{x1:X(m.a),y1:Y(m.a),x2:X(m.b),y2:Y(m.b),stroke:'var(--mirror)','stroke-width':1.6,'stroke-linecap':'round'},svg);
    if(m.label) el('text',{x:X(m.labelAt),y:Y(m.labelAt),'font-size':4.6,'font-weight':900,fill:'var(--ink-soft)'},svg).textContent=m.label;
  }

  // ヒント① 像（鏡について対称な点）　ヒント② 像と目を結ぶ線
  const IMG='#9b86d6';
  if(lv>=1) for(const m of P.mirrors) for(const o of objs){
    if(!front(o,m)) continue;
    const Q2=reflect(o.at,m);
    el('line',{x1:X(o.at),y1:Y(o.at),x2:X(Q2),y2:Y(Q2),stroke:IMG,'stroke-width':.6,'stroke-dasharray':'1.2 1.2',opacity:.75},svg);
    if(lv>=2) el('line',{x1:X(Q2),y1:Y(Q2),x2:X(E),y2:Y(E),stroke:IMG,'stroke-width':.9,'stroke-dasharray':'2.6 1.4'},svg);
    el('circle',{cx:X(Q2),cy:Y(Q2),r:2.1,fill:'#fff',stroke:IMG,'stroke-width':.9,'stroke-dasharray':'1.4 1'},svg);
    el('text',{x:X(Q2)+2.8,y:Y(Q2)-2.4,'font-size':3.8,'font-weight':900,fill:'#7b64c0'},svg).textContent=o.id+'の像';
  }
  if(lv>=2) for(const m of P.mirrors) for(const o of objs) if(onLine(o,m) && side(E,m)!==0)
    el('line',{x1:X(o.at),y1:Y(o.at),x2:X(E),y2:Y(E),stroke:IMG,'stroke-width':.9,'stroke-dasharray':'2.6 1.4'},svg);

  // ヒント③ 光の道すじ（鏡にうつって見える物すべて）
  if(lv>=3){
    const pathG=el('g',{},svg);
    for(const o of objs) for(const m of P.mirrors){
      const H=seenVia(E,o.at,m); if(!H) continue;
      const Q2=reflect(o.at,m);
      el('line',{x1:X(H),y1:Y(H),x2:X(Q2),y2:Y(Q2),stroke:'var(--ray)','stroke-width':1,'stroke-dasharray':'2.2 1.6',opacity:.85},pathG);   // 像へのばした線（鏡の向こう）
      el('line',{x1:X(o.at),y1:Y(o.at),x2:X(H),y2:Y(H),stroke:'var(--ray)','stroke-width':1.6,'marker-end':`url(#arw-${opt.uid})`},pathG);
      const toE=sub(E,H), lE=Math.hypot(...toE), Eend=addv(H,mul(toE,Math.max(0,(lE-0.42)/lE)));   // 目にかからないよう少し手前で止める
      el('line',{x1:X(H),y1:Y(H),x2:X(Eend),y2:Y(Eend),stroke:'var(--ray)','stroke-width':1.6,'marker-end':`url(#arw-${opt.uid})`},pathG);
      el('circle',{cx:X(H),cy:Y(H),r:1.1,fill:'var(--ink)'},pathG);
      if(st.ang) drawAngles(pathG,o.at,H,E,m,X,Y);
    }
  }

  // 物（見える・見えないの印は、ヒント③まで出さない）
  for(const [i,o] of objs.entries()){
    const seen=lv>=3 && seenOf(o);
    const gg=el('g',{class:opt.interactive?'drag':'', 'data-obj':i},svg);
    if(opt.interactive) el('circle',{cx:X(o.at),cy:Y(o.at),r:5,fill:'transparent'},gg);   // さわりやすく
    if(seen) el('circle',{cx:X(o.at),cy:Y(o.at),r:3.4,fill:'none',stroke:'var(--ray)','stroke-width':1.4},gg);
    el('circle',{cx:X(o.at),cy:Y(o.at),r:2.1,fill:o.color||(lv>=3&&!seen?'var(--off)':'#4a3a2a')},gg);
    const lx=X(o.at)+(o.at[0]>=P.cols-.5?-3.6:3.2), anchor=o.at[0]>=P.cols-.5?'end':'start';
    el('text',{x:lx,y:Y(o.at)-2.6,'font-size':4.8,'font-weight':900,fill:'var(--ink)','text-anchor':anchor},gg).textContent=o.id;
  }

  // 目（観察する位置）
  const eg=el('g',{class:opt.interactive?'drag':'', 'data-eye':1},svg);
  if(opt.interactive) el('circle',{cx:X(E),cy:Y(E),r:5.5,fill:'transparent'},eg);
  el('path',{d:eyePath(X(E),Y(E)),fill:'#3a3040'},eg);
  el('circle',{cx:X(E),cy:Y(E),r:1,fill:'#fff'},eg);
  el('text',{x:X(E)-3.4,y:Y(E)+5.6,'font-size':4.8,'font-weight':900,fill:'var(--ink)','text-anchor':'end'},eg).textContent=P.eye.label;
}
// 目の形（アーモンド形）
function eyePath(x,y){ const w=3.6,h=2.3; return `M${x-w},${y} Q${x},${y-h*1.6} ${x+w},${y} Q${x},${y+h*1.6} ${x-w},${y} Z`; }
// 法線と、入射角・反射角
function normalAt(g,H,n,X,Y){ const N2=addv(H,mul(n,2.2)), N1=addv(H,mul(n,-.6));
  el('line',{x1:X(N1),y1:Y(N1),x2:X(N2),y2:Y(N2),stroke:'var(--ink-soft)','stroke-width':.6,'stroke-dasharray':'1.2 1'},g); }
function angArc(g,H,n,P,col,X,Y){
  const v=sub(P,H), lv=Math.hypot(...v); if(lv<1e-9) return; const u=mul(v,1/lv), r=0.9;
  const p1=addv(H,mul(n,r)), p2=addv(H,mul(u,r)), sweep=cross(n,u)>0?1:0;
  el('path',{d:`M${X(p1)},${Y(p1)} A${r*C},${r*C} 0 0 ${sweep} ${X(p2)},${Y(p2)}`,fill:'none',stroke:col,'stroke-width':1.2},g);
  const ang=Math.round(Math.acos(Math.max(-1,Math.min(1,dot(n,u))))*180/Math.PI);
  const bis=addv(n,u), lb=Math.hypot(...bis)||1, mid=addv(H,mul(bis,1.55/lb));
  el('text',{x:X(mid),y:Y(mid),'font-size':3.4,'font-weight':900,fill:col,'text-anchor':'middle'},g).textContent=ang+'°';
}
function drawAngles(g,Q,H,E,m,X,Y){
  const d=sub(m.b,m.a), L=Math.hypot(...d), n0=[-d[1]/L,d[0]/L], s=side(E,m)||1, n=mul(n0,s);
  normalAt(g,H,n,X,Y); angArc(g,H,n,Q,'#7b4fc9',X,Y); angArc(g,H,n,E,'#2f7fd0',X,Y);
}

/* ---------- ヒントの段階（はじめは答えを出さない。押すたびに手がかりが1つずつ増える） ---------- */
const MARU='①②③④⑤⑥⑦⑧⑨⑩⑪⑫';
function hintSteps(){
  const k=CUR.kind;
  if(!k) return ['像をかく', `像と ${CUR.eye.label} を結ぶ`, '光の道すじ・見える範囲'];
  if(k==='via2') return ['Q の像（手鏡）', 'その像（洗面台の鏡）', '像と P を結ぶ', '光の道すじ'];
  if(k==='side') return ['像をかく', '目と、像の頭・足先を結ぶ', '目と、鏡のはしを結ぶ', '光の道すじ', '見える範囲・必要な長さ'];
  if(k==='ray'){ const out=[]; for(const h of rayRefl()) out.push(h.m.label+'：法線と入射角', h.m.label+'：はね返った光'); return out; }
  return [];
}
function rayRefl(){ return trace(CUR,ST.src,ST.dir).hits.filter(h=>!h.wall&&!h.back); }
function renderHints(){
  const steps=hintSteps(), n=steps.length;
  if(ST.hint>n) ST.hint=n;
  const box=document.getElementById('hintList');
  box.innerHTML=steps.map((t,i)=>`<button data-h="${i+1}" class="${i<ST.hint?'on':''}"><span class="no">${MARU[i]}</span>${t}</button>`).join('');
  box.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{ const h=+b.dataset.h; ST.hint = ST.hint===h ? h-1 : h; render(); });
  const nx=document.getElementById('hNext');
  document.getElementById('cardShow').style.display = n ? '' : 'none';
  nx.textContent = ST.hint<n ? `ヒント${MARU[ST.hint]}を出す` : 'ヒントをぜんぶかくす';
  const angOK = (!CUR.kind && ST.hint>=3) || (CUR.kind==='via2' && ST.hint>=4);
  document.getElementById('angWrap').style.display = angOK ? '' : 'none';
  document.getElementById('tAng').classList.toggle('on',!!ST.ang);
}
document.getElementById('hNext').onclick=()=>{ const n=hintSteps().length; ST.hint = ST.hint<n ? ST.hint+1 : 0; render(); };

function render(){
  if(CUR.kind){ KIND[CUR.kind].draw(fig,CUR,ST,{uid:'main',interactive:true}); renderHints(); KIND[CUR.kind].msg();
    document.getElementById('figHint').textContent = ST.hint ? '' : 'わからないときは、ヒントを1つずつ出してみよう'; return; }
  drawBoard(fig,CUR,ST,{uid:'main',interactive:true});
  renderHints();
  // 文
  const E=ST.eye, P=CUR, lv=ST.hint, word=P.objWord, el_=P.eye.label;
  let html='';
  if(P.mirrors.every(m=>side(E,m)===0)) html=`目が鏡の面と同じ線の上にいます。少しずらしてみよう。`;
  else if(lv===0) html=P.ask;
  else if(lv===1){ html=`鏡の向こうに、それぞれの<b>像</b>をかいた。像は、鏡について物と対称な位置（鏡から同じ距離）にできる。`;
    const on=P.objs.filter((o,i)=>P.mirrors.some(m=>side(ST.objs[i],m)===0)).map(o=>o.id);
    if(on.length) html+=`<br>（${on.join('・')} は鏡の面をのばした線の上にあるので、像は ${on.join('・')} と重なる）`; }
  else if(lv===2) html=`像と ${el_} を結んだ（紫の点線）。この線が<b>鏡を通っていれば</b>、その${word}から出た光は鏡ではね返って ${el_} に届く。`;
  else {
    const seen=P.objs.filter((o,i)=>P.mirrors.some(m=>seenVia(E,ST.objs[i],m))).map(o=>o.id);
    const unseen=P.objs.map(o=>o.id).filter(id=>!seen.includes(id));
    if(P.objs.length===1) html = seen.length ? `${P.objs[0].id} から出た光は、鏡の ● ではね返って <b>${el_}</b> に届く。像と ${el_} を結んだ線が鏡と交わる点で、光ははね返る。`
                                               : `${P.objs[0].id} から出た光は、鏡ではね返っても ${el_} に届かない（像と ${el_} を結んだ線が鏡を通らない）。`;
    else html = `${el_} から鏡にうつって見えるのは <b>${seen.join('・')||'なし'}</b>。見えないのは <b>${unseen.join('・')||'なし'}</b>。<br>色のついた範囲（見える範囲）にある${word}だけが見える。`;
  }
  document.getElementById('msg').innerHTML=html;
  document.getElementById('figHint').textContent = lv ? '' : 'わからないときは、ヒントを1つずつ出してみよう';
}
document.getElementById('tAng').onclick=()=>{ ST.ang=!ST.ang; render(); };
document.getElementById('btnReset').onclick=()=>{ ST = CUR.kind==='side' ? sideState(ST.preset) : initState(CUR); if(CUR.kind==='side') buildSideControls(); render(); };
document.getElementById('btnHome').onclick=goHome;

/* ---------- つかんで動かす（マスの点にすいつく） ---------- */
let drag=null;
function svgPt(e){ const p=fig.createSVGPoint(); p.x=e.clientX; p.y=e.clientY; const q=p.matrixTransform(fig.getScreenCTM().inverse()); return [q.x/C,q.y/C]; }
function snap(p){ return [Math.max(0,Math.min(CUR.cols,Math.round(p[0]))), Math.max(0,Math.min(CUR.rows,Math.round(p[1])))]; }
fig.addEventListener('pointerdown',e=>{
  if(CUR.kind && KIND[CUR.kind].down){ KIND[CUR.kind].down(e); return; }
  const t=e.target.closest('[data-obj],[data-eye]'); if(!t) return;
  e.preventDefault(); fig.setPointerCapture(e.pointerId);
  drag={ kind:t.dataset.eye?'eye':'obj', i:+t.dataset.obj, x0:e.clientX, y0:e.clientY, moved:false };
});
fig.addEventListener('pointermove',e=>{
  if(!drag) return;
  if(drag.custom){ drag.custom(e); return; }
  if(!drag.moved && Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)<6) return;
  drag.moved=true;
  const p=snap(svgPt(e));
  // 鏡の上・ほかの点と同じ場所には置かない
  const others=[ST.eye,...ST.objs].filter((q,k)=> drag.kind==='eye'? k!==0 : k!==drag.i+1);
  if(others.some(q=>near(q,p))) return;
  if(CUR.mirrors.some(m=>onSeg(p,m))) return;
  if(drag.kind==='eye') ST.eye=p; else ST.objs[drag.i]=p;
  render();
});
function endDrag(){
  if(drag && drag.custom){ drag=null; return; }
  drag=null;
}
fig.addEventListener('pointerup',endDrag); fig.addEventListener('pointercancel',endDrag);

/* =========================================================
   型B（光の道すじ）・型D（全身鏡）
   ========================================================= */
const unit=v=>{ const L=Math.hypot(...v)||1; return [v[0]/L,v[1]/L]; };
function normalOf(m){ const d=sub(m.b,m.a), L=Math.hypot(...d); return [-d[1]/L, d[0]/L]; }
// 方眼・矢じりの下地（型Aの drawBoard と同じ見た目）
function baseBoard(svg,P,opt){
  svg.innerHTML='';
  const W=P.cols*C, H=P.rows*C;
  svg.setAttribute('viewBox',`${-PAD*3} ${-PAD*3} ${W+PAD*6} ${H+PAD*6}`);
  const defs=el('defs',{},svg);
  const mk=el('marker',{id:'arw-'+opt.uid,viewBox:'0 0 10 10',refX:6,refY:5,markerWidth:3,markerHeight:3,orient:'auto-start-reverse'},defs);
  el('path',{d:'M0,0 L10,5 L0,10 z',fill:'var(--ray)'},mk);
  const g=el('g',{},svg);
  for(let i=0;i<=P.cols;i++) el('line',{x1:i*C,y1:0,x2:i*C,y2:H,stroke:'var(--grid)','stroke-width':.6},g);
  for(let j=0;j<=P.rows;j++) el('line',{x1:0,y1:j*C,x2:W,y2:j*C,stroke:'var(--grid)','stroke-width':.6},g);
  return { X:p=>p[0]*C, Y:p=>p[1]*C };
}
// 鏡（表＝銀、うら＝濃い灰）。表は m.front の側
function drawMirror(svg,m,X,Y){
  const n=normalOf(m), s=side(m.front,m)||1, back=mul(n,-s*0.32);
  const pa=addv(m.a,back), pb=addv(m.b,back);
  el('path',{d:`M${X(m.a)},${Y(m.a)} L${X(m.b)},${Y(m.b)} L${X(pb)},${Y(pb)} L${X(pa)},${Y(pa)} Z`,fill:'var(--mirror-d)'},svg);
  el('line',{x1:X(m.a),y1:Y(m.a),x2:X(m.b),y2:Y(m.b),stroke:'var(--mirror)','stroke-width':1.6,'stroke-linecap':'round'},svg);
  if(m.label) el('text',{x:X(m.labelAt),y:Y(m.labelAt),'font-size':4.4,'font-weight':900,fill:'var(--ink-soft)'},svg).textContent=m.label;
}
function rayLine(g,a,b,uid,w=1.6){   // 線のまん中に矢じり
  const mid=addv(a,mul(sub(b,a),.55));
  el('line',{x1:a[0]*C,y1:a[1]*C,x2:mid[0]*C,y2:mid[1]*C,stroke:'var(--ray)','stroke-width':w,'marker-end':`url(#arw-${uid})`},g);
  el('line',{x1:mid[0]*C,y1:mid[1]*C,x2:b[0]*C,y2:b[1]*C,stroke:'var(--ray)','stroke-width':w},g);
}
const DIRW=['右','右下','下','左下','左','左上','上','右上'];
const dirWord=d=>DIRW[((Math.round(Math.atan2(d[1],d[0])/(Math.PI/4))%8)+8)%8];

/* ---------- 光をたどる ---------- */
function trace(P,src,dir){
  const pts=[src], hits=[]; let o=src, d=unit(dir), end='out';
  for(let k=0;k<10;k++){
    let best=null;
    const far=addv(o,mul(d,1000));
    for(const m of P.mirrors){ const h=segHit(o,far,m.a,m.b); if(h && h.t*1000>1e-6 && (!best||h.t<best.t)) best={...h,m,wall:false}; }
    for(const w of (P.walls||[])){ const h=segHit(o,far,w.a,w.b); if(h && h.t*1000>1e-6 && (!best||h.t<best.t)) best={...h,m:w,wall:true}; }
    // 方眼の外に出る所
    let tb=Infinity;
    if(d[0]>1e-12) tb=Math.min(tb,(P.cols-o[0])/d[0]); if(d[0]<-1e-12) tb=Math.min(tb,(0-o[0])/d[0]);
    if(d[1]>1e-12) tb=Math.min(tb,(P.rows-o[1])/d[1]); if(d[1]<-1e-12) tb=Math.min(tb,(0-o[1])/d[1]);
    tb=Math.max(0,tb);
    if(best && best.t*1000 <= tb+1e-9){
      const H=best.p; pts.push(H);
      if(best.wall){ end='wall'; hits.push({p:H,m:best.m,wall:true}); break; }
      const m=best.m, sO=side(o,m), sF=side(m.front,m);
      if(sO!==sF){ end='back'; hits.push({p:H,m,back:true}); break; }       // 鏡のうらに当たった
      const n=normalOf(m); d=sub(d,mul(n,2*dot(d,n))); o=H; hits.push({p:H,m});
      continue;
    }
    pts.push(addv(o,mul(d,tb))); break;
  }
  return { pts, hits, end, lastDir:d };
}
function distSeg(p,a,b){ const ab=sub(b,a), t=Math.max(0,Math.min(1,dot(sub(p,a),ab)/(dot(ab,ab)||1))); return Math.hypot(...sub(p,addv(a,mul(ab,t)))); }
function targetsHit(P,tr){
  const out=[];
  for(const t of (P.targets||[])){
    for(let i=0;i<tr.pts.length-1;i++) if(distSeg(t.at,tr.pts[i],tr.pts[i+1])<0.13){ out.push({t,i}); break; }
  }
  return out.sort((a,b)=>a.i-b.i);
}

const KIND={};
KIND.ray={
  draw(svg,P,st,opt){
    const {X,Y}=baseBoard(svg,P,opt);
    for(const m of P.mirrors) drawMirror(svg,m,X,Y);
    for(const w of (P.walls||[])){
      el('line',{x1:X(w.a),y1:Y(w.a),x2:X(w.b),y2:Y(w.b),stroke:'#a8a29a','stroke-width':2.2},svg);
      if(w.label) el('text',{x:X(w.labelAt),y:Y(w.labelAt),'font-size':4.4,'font-weight':900,fill:'var(--ink-soft)'},svg).textContent=w.label;
    }
    const tr=trace(P,st.src,st.dir), th=targetsHit(P,tr);
    const refl=tr.hits.filter(h=>!h.wall&&!h.back), nR=refl.length, lv=Math.min(st.hint||0, 2*nR), done=lv>=2*nR;
    const nSeg=Math.min(tr.pts.length-1, 1+Math.floor(lv/2));        // 見せる光の線の数（はじめは最初の鏡まで）
    const g=el('g',{},svg);
    for(let i=0;i<nSeg;i++) rayLine(g,tr.pts[i],tr.pts[i+1],opt.uid);
    refl.forEach((h,r)=>{
      if(r>=nSeg) return;
      el('circle',{cx:X(h.p),cy:Y(h.p),r:1.1,fill:'var(--ink)'},g);
      if(r<Math.ceil(lv/2)){                                          // 法線と入射角
        const n=mul(normalOf(h.m), side(tr.pts[r],h.m)||1);
        normalAt(g,h.p,n,X,Y); angArc(g,h.p,n,tr.pts[r],'#7b4fc9',X,Y);
        if(r<Math.floor(lv/2)) angArc(g,h.p,n,tr.pts[r+2],'#2f7fd0',X,Y);   // 反射角
      }
    });
    // 的（ア〜エ・P）。光が通ったかの印は、光の道すじをぜんぶ出してから
    for(const t of (P.targets||[])){
      const on=done && th.some(x=>x.t===t);
      if(on) el('circle',{cx:X(t.at),cy:Y(t.at),r:3.2,fill:'none',stroke:'var(--ray)','stroke-width':1.4},svg);
      el('circle',{cx:X(t.at),cy:Y(t.at),r:1.5,fill:'#3a3040'},svg);
      const lx=X(t.at)+(t.left?-2.8:2.8);
      el('text',{x:lx,y:Y(t.at)+1.7,'font-size':4.8,'font-weight':900,fill:'var(--ink)','text-anchor':t.left?'end':'start'},svg).textContent=t.id;
    }
    // 光源装置（光の向きにそろえた箱）とつまみ
    const d=unit(st.dir), ang=Math.atan2(d[1],d[0])*180/Math.PI, s=st.src;
    const box=el('g',{transform:`translate(${X(s)},${Y(s)}) rotate(${ang})`,class:opt.interactive?'drag':'','data-srcbox':1},svg);
    el('rect',{x:-11,y:-3.6,width:9.5,height:7.2,rx:1.6,fill:'#3a3040'},box);
    el('rect',{x:-3,y:-1.6,width:1.8,height:3.2,fill:'#f6d27a'},box);
    if(opt.interactive) el('rect',{x:-13,y:-6,width:14,height:12,fill:'transparent'},box);
    if(P.source.label) el('text',{x:X(s)+2.6,y:Y(s)+5.2,'font-size':4.8,'font-weight':900,fill:'var(--ink)'},svg).textContent=P.source.label;
    el('circle',{cx:X(s),cy:Y(s),r:1.2,fill:'#3a3040'},svg);
    if(opt.interactive){
      const k=addv(s,mul(d,-1.45)), kg=el('g',{class:'drag','data-knob':1},svg);
      el('circle',{cx:X(k),cy:Y(k),r:6,fill:'transparent'},kg);
      el('circle',{cx:X(k),cy:Y(k),r:3.1,fill:'#fff',stroke:'var(--btn)','stroke-width':1.4},kg);
      el('path',{d:`M${X(k)-1.6},${Y(k)-.6} A1.7,1.7 0 1 1 ${X(k)+.4},${Y(k)+1.6}`,fill:'none',stroke:'var(--btn)','stroke-width':.8},kg);
    }
    KIND.ray._last={tr,th,refl,lv,done};
  },
  msg(){
    const {tr,th,refl,lv,done}=KIND.ray._last, P=CUR;
    const route=refl.map(h=>h.m.label);
    let html='';
    if(!done){                                                         // とちゅう：答えはまだ言わない
      const r=Math.floor(lv/2), h=refl[r];
      html = lv%2===0
        ? `光は <b>${h.m.label}</b> に当たった。ここから、どの向きにはね返るかな？`
        : `${h.m.label} に<b>法線</b>（点線）をかいた。紫の角が入射角。はね返った光は、<b>反射角が入射角と同じ</b>になる向きに進む。`;
      document.getElementById('msg').innerHTML=html; return;
    }
    const goal=th.find(x=>x.t.goal), onA=th.filter(x=>!x.t.goal);
    if(P.id==='nagasaki'){
      const first=onA[0]?onA[0].t.id:null;
      const viaB=route.includes('平面鏡B') && route.includes('平面鏡A');
      html = goal && viaB ? `平面鏡Aの <b>${first||'ア〜エのあいだ'}</b> に当てると、平面鏡Bではね返って <b>P の上を通った</b>！`
           : goal ? `P の上は通ったけれど、${route.includes('平面鏡A')?'平面鏡Bではね返っていない':'平面鏡Aではね返っていない'}。2枚とも1回ずつはね返らせよう。`
                  : `光は ${route.length?route.join('→')+' ではね返って、':''}P の上を通っていない。${first?'いまは平面鏡Aの <b>'+first+'</b> に当たっている。':''}`;
    } else if(P.id==='screen'){
      const wallHit=tr.end==='wall', t=th.filter(x=>x.t.at[0]===8).pop();
      html = route.length ? `光は ${route.join('→')} ではね返って、` : '光は鏡に当たらずに、';
      html += wallHit ? (t ? `スクリーンの <b>${t.t.id}</b> に届いた。` : 'スクリーンに届いた（ア〜エの間）。') : 'スクリーンに届かない。';
    } else {
      html = route.length ? route.map(r=>`${r}ではね返り`).join('、')+`、最後は <b>${dirWord(tr.lastDir)}</b> へ進む。` : `光は <b>${dirWord(tr.lastDir)}</b> へ進む。`;
      const d0=unit(ST.dir); if(route.length===2 && Math.abs(dot(d0,tr.lastDir)+1)<1e-6) html+='<br>はじめの光と<b>平行で、逆向き</b>。直角に合わせた鏡は、光を来た向きに返す。';
    }
    if(tr.end==='back') html+='<br>（鏡のうらに当たった光は、はね返らない）';
    document.getElementById('msg').innerHTML=html;
  },
  down(e){
    const t=e.target.closest('[data-knob],[data-srcbox]'); if(!t) return;
    e.preventDefault(); fig.setPointerCapture(e.pointerId);
    if(t.dataset.knob){
      drag={ custom:ev=>{
        const p=svgPt(ev), v=sub(ST.src,p);           // つまみは光源のうしろがわ。つまみ→光源の向きに光が出る
        if(Math.hypot(...v)<.3) return;
        ST.dir=snapDir(v); render();
      }};
    } else {
      drag={ custom:ev=>{
        const p=snap(svgPt(ev)); if(near(p,ST.src)) return;
        if(CUR.mirrors.some(m=>onSeg(p,m))) return;
        ST.src=p; render();
      }};
    }
  }
};
// マスの点を通る向き（たて・よこ 8 マスまで）に 1.5° 以内ならすいつく
function snapDir(v){
  const a=Math.atan2(v[1],v[0]); let best=null, bd=1.5*Math.PI/180;
  for(let dx=-8;dx<=8;dx++) for(let dy=-8;dy<=8;dy++){ if(!dx&&!dy) continue;
    const g=gcd(Math.abs(dx),Math.abs(dy)); if(g!==1) continue;
    let df=Math.abs(Math.atan2(dy,dx)-a); if(df>Math.PI) df=2*Math.PI-df;
    if(df<bd){ bd=df; best=[dx,dy]; } }
  return best || unit(v);
}
function gcd(a,b){ return b?gcd(b,a%b):a; }

/* ---------- 型B：2枚の鏡でとどく道すじ（手鏡） ---------- */
function via2Path(P,E,Q){
  const m1=P.mirrors[P.order[0]], m2=P.mirrors[P.order[1]];
  const f1=side(m1.front,m1), f2=side(m2.front,m2);
  if(side(Q,m1)!==f1 || side(E,m2)!==f2) return null;
  const Q1=reflect(Q,m1), Q2=reflect(Q1,m2);
  const h2=segHit(E,Q2,m2.a,m2.b); if(!h2) return { Q1,Q2 };
  const H2=h2.p; if(side(H2,m1)!==f1) return { Q1,Q2 };
  const h1=segHit(H2,Q1,m1.a,m1.b); if(!h1) return { Q1,Q2,H2,miss:1 };
  return { Q1,Q2,H1:h1.p,H2,ok:true };
}
KIND.via2={
  draw(svg,P,st,opt){
    const {X,Y}=baseBoard(svg,P,opt);
    for(const m of P.mirrors) drawMirror(svg,m,X,Y);
    const E=st.eye, Q=st.objs[0], r=via2Path(P,E,Q);
    const g=el('g',{},svg), lv=st.hint||0;
    if(r){
      const dash={stroke:'#9b86d6','stroke-width':.8,'stroke-dasharray':'1.6 1.2'};
      const img=(p,t)=>{ el('circle',{cx:X(p),cy:Y(p),r:2.1,fill:'#fff',stroke:'#9b86d6','stroke-width':.9,'stroke-dasharray':'1.4 1'},g);
        el('text',{x:X(p),y:Y(p)-3.4,'font-size':3.6,'font-weight':900,fill:'#7b64c0','text-anchor':'middle'},g).textContent=t; };
      if(lv>=1){ el('line',{x1:X(Q),y1:Y(Q),x2:X(r.Q1),y2:Y(r.Q1),...dash},g); img(r.Q1,'Qの像（手鏡）'); }
      if(lv>=2){ el('line',{x1:X(r.Q1),y1:Y(r.Q1),x2:X(r.Q2),y2:Y(r.Q2),...dash},g); img(r.Q2,'その像（洗面台の鏡）'); }
      if(lv>=3){ el('line',{x1:X(E),y1:Y(E),x2:X(r.Q2),y2:Y(r.Q2),stroke:'#9b86d6','stroke-width':.9,'stroke-dasharray':'2.6 1.4'},g);
                 if(r.H2) el('circle',{cx:X(r.H2),cy:Y(r.H2),r:1.1,fill:'var(--ink)'},g); }
      if(lv>=4 && r.ok){ el('line',{x1:X(r.H2),y1:Y(r.H2),x2:X(r.Q2),y2:Y(r.Q2),stroke:'var(--ray)','stroke-width':.9,'stroke-dasharray':'2 1.5',opacity:.8},g);
                         el('line',{x1:X(r.H1),y1:Y(r.H1),x2:X(r.Q1),y2:Y(r.Q1),stroke:'var(--ray)','stroke-width':.9,'stroke-dasharray':'2 1.5',opacity:.8},g); }
    }
    if(lv>=4 && r && r.ok){
      const Eend=addv(r.H2,mul(sub(E,r.H2),Math.max(0,1-.42/Math.hypot(...sub(E,r.H2)))));
      rayLine(g,Q,r.H1,opt.uid); rayLine(g,r.H1,r.H2,opt.uid); rayLine(g,r.H2,Eend,opt.uid);
      for(const p of [r.H1,r.H2]) el('circle',{cx:X(p),cy:Y(p),r:1.1,fill:'var(--ink)'},g);
      if(st.ang){ drawAngles(g,Q,r.H1,r.H2,P.mirrors[P.order[0]],X,Y); drawAngles(g,r.H1,r.H2,E,P.mirrors[P.order[1]],X,Y); }
    }
    // Q（後頭部）と P（目）
    const qg=el('g',{class:opt.interactive?'drag':'','data-obj':0},svg);
    if(opt.interactive) el('circle',{cx:X(Q),cy:Y(Q),r:5,fill:'transparent'},qg);
    el('circle',{cx:X(Q),cy:Y(Q),r:2.1,fill:'#4a3a2a'},qg);
    el('text',{x:X(Q)+3,y:Y(Q)+6,'font-size':4.8,'font-weight':900,fill:'var(--ink)'},qg).textContent='Q';
    const eg=el('g',{class:opt.interactive?'drag':'','data-eye':1},svg);
    if(opt.interactive) el('circle',{cx:X(E),cy:Y(E),r:5.5,fill:'transparent'},eg);
    el('path',{d:eyePath(X(E),Y(E)),fill:'#3a3040'},eg); el('circle',{cx:X(E),cy:Y(E),r:1,fill:'#fff'},eg);
    el('text',{x:X(E)-1.5,y:Y(E)+6.4,'font-size':4.8,'font-weight':900,fill:'var(--ink)','text-anchor':'end'},eg).textContent='P';
    KIND.via2._last=r;
  },
  msg(){
    const r=KIND.via2._last, lv=ST.hint;
    const ng='いまの位置では、Q から出た光が2枚の鏡ではね返って P に届く道すじがない（鏡からはみ出す）。P や Q を動かしてみよう。';
    document.getElementById('msg').innerHTML =
        lv===0 ? 'Q（後頭部）から出た光が、<b>手鏡 → 洗面台の鏡</b> の順にはね返って P（目）に届く。その<b>道すじ</b>は？'
      : !r ? ng
      : lv===1 ? '手鏡にうつる Q の<b>像</b>をかいた（手鏡について Q と対称な点）。'
      : lv===2 ? 'その像が、さらに洗面台の鏡にうつった<b>像</b>をかいた。P が洗面台の鏡に見ているのは、この像。'
      : lv===3 ? (r.H2 ? 'P とその像を結んだ。洗面台の鏡と交わる点 ● で、光がはね返る。そこから手鏡の像（Qの像）に向かって線をのばすと…？' : ng)
      : r.ok ? 'Q から出た光は、<b>手鏡 → 洗面台の鏡</b> の順にはね返って、P に届く。だから P から後頭部が見える。' : ng;
  },
  down(e){

  }
};

function sideState(key){ const p=SIDE_PRESET[key]; return { preset:key, H:p.H, eye:p.eye, dist:p.dist, top:p.top, bot:p.bot, hint:0 }; }
function buildSideControls(){
  const box=document.getElementById('extra');
  const pr=Object.entries(SIDE_PRESET).map(([k,p])=>`<button data-pre="${k}" class="${ST.preset===k?'on':''}">${p.name}</button>`).join('');
  const sl=(id,label,min,max)=>`<label class="sl"><span>${label}<b id="v_${id}"></b></span><input type="range" id="s_${id}" min="${min}" max="${max}" step="1" value="${ST[id]}"></label>`;
  box.innerHTML=`<h3>プリントの問題</h3><div class="tog pre">${pr}</div>
    <h3 style="margin-top:10px">変えてみる</h3>
    ${sl('H','身長',100,190)}${sl('eye','目の高さ',60,187)}${sl('dist','鏡までの距離',30,250)}${sl('top','鏡の上はし',0,200)}${sl('bot','鏡の下はし',0,200)}`;
  box.querySelectorAll('[data-pre]').forEach(b=>b.onclick=()=>{ ST=sideState(b.dataset.pre); buildSideControls(); render(); });   // 問題を変えたらヒントもはじめから
  for(const id of ['H','eye','dist','top','bot']){
    const inp=document.getElementById('s_'+id);
    inp.oninput=()=>{ const prevH=ST.H; ST[id]=+inp.value;
      if(id==='H') ST.eye+=ST.H-prevH;
      ST.eye=Math.max(ST.H-25,Math.min(ST.H-5,ST.eye));   // 頭のてっぺんから目まで 5〜25cm（絵がのびすぎない）
      // 鏡の長さが 5cm より短くならないように（上はしと下はしが同じ・逆にならない）
      if(id==='top' && ST.top-ST.bot<5){ ST.top=Math.max(5,ST.top); ST.bot=ST.top-5; }
      if(id==='bot' && ST.top-ST.bot<5){ ST.bot=Math.min(195,ST.bot); ST.top=ST.bot+5; }
      syncSliders(); render(); };
  }
  syncSliders();
}
function syncSliders(){ for(const id of ['H','eye','dist','top','bot']){ const i=document.getElementById('s_'+id); if(!i) continue; i.value=ST[id]; document.getElementById('v_'+id).textContent=ST[id]+' cm'; } }
// 人の絵（ChatGPT で作った横向きの絵。img/person_side.png は左向き・頭のてっぺん〜くつ先で切りぬき、150×760）
// 絵の目は上から 80px。目の高さで上下2つに分けてそれぞれのばし、絵の目をスライダーの目の高さにそろえる
const PERSON_SIDE={ src:'img/person_side.png', w:150, h:760, eyePx:80, eyeX:.28, aspect:150/760 };   // eyeX＝絵の前はしから目までの幅の割合
const personW=H=>H*PERSON_SIDE.aspect;
function drawPerson(g,x,H,eye,face,opacity){
  const w=personW(H), Y=h=>-h, S=PERSON_SIDE;
  const pg=el('g',{opacity},g);
  if(face>0) pg.setAttribute('transform',`translate(${2*x},0) scale(-1,1)`);   // 右向き（鏡の向こうの像）は左右反転
  const ov=.6;                                                       // つなぎ目に線が出ないよう、上の部分を少し重ねる
  for(const [y0,y1,top,bot,ex] of [[S.eyePx,S.h,eye,0,0],[0,S.eyePx,H,eye,ov]]){
    const vh=(y1-y0)*(1+ex/(top-bot));
    const sv=el('svg',{x:x-w/2,y:Y(top),width:w,height:top-bot+ex,viewBox:`0 ${y0} ${S.w} ${vh}`,preserveAspectRatio:'none',overflow:'hidden'},pg);
    el('image',{href:S.src,x:0,y:0,width:S.w,height:S.h},sv);
  }
  if(opacity>=1) el('circle',{cx:x+face*w*(.5-S.eyeX),cy:Y(eye),r:2.2,fill:'none',stroke:'var(--ray)','stroke-width':1.2},g);   // 目の高さ（スライダーの値）
}
KIND.side={
  draw(svg,P,st,opt){
    svg.innerHTML='';
    const W=Math.max(st.dist,100)+45;
    svg.setAttribute('viewBox',`${-W} ${-212} ${2*W} ${236}`);
    const defs=el('defs',{},svg);
    const mk=el('marker',{id:'arw-'+opt.uid,viewBox:'0 0 10 10',refX:6,refY:5,markerWidth:3,markerHeight:3,orient:'auto-start-reverse'},defs);
    el('path',{d:'M0,0 L10,5 L0,10 z',fill:'var(--ray)'},mk);
    const Y=h=>-h;
    // 方眼（10cmごと）と床
    for(let x=-Math.floor(W/10)*10;x<=W;x+=10) el('line',{x1:x,y1:Y(0),x2:x,y2:Y(200),stroke:'var(--grid)','stroke-width':x%50?.35:.7},svg);
    for(let h=0;h<=200;h+=10) el('line',{x1:-W,y1:Y(h),x2:W,y2:Y(h),stroke:'var(--grid)','stroke-width':h%50?.35:.7},svg);
    el('line',{x1:-W,y1:0,x2:W,y2:0,stroke:'#6e6053','stroke-width':1.6},svg);
    for(let h=0;h<=200;h+=50) el('text',{x:-W+2,y:Y(h)-1.5,'font-size':6,'font-weight':900,fill:'var(--ink-soft)'},svg).textContent=h+'cm';
    const {H,eye,dist,top,bot}=st, lo=Math.max(0,2*bot-eye), hi=Math.min(H,2*top-eye), lv=st.hint||0;
    // ヒント⑤ 鏡に見える部分（人と像の上に色）
    if(lv>=5 && hi>lo) for(const x of [dist,-dist]) el('rect',{x:x-15,y:Y(hi),width:30,height:hi-lo,fill:'var(--zone)',stroke:'var(--zone-bd)','stroke-width':.6,'stroke-dasharray':'2 1.5'},svg);
    if(lv>=1){ drawPerson(svg,-dist,H,eye,1,.45);   // ヒント① 像（鏡の向こう）
      el('text',{x:-dist,y:Y(H)-4,'font-size':6,'font-weight':900,fill:'#7b64c0','text-anchor':'middle'},svg).textContent='像'; }
    drawPerson(svg,dist,H,eye,-1,1);                // 本人（鏡を向いている）
    if(opt.interactive){ const hit=el('rect',{x:dist-16,y:Y(H),width:32,height:H,fill:'transparent',class:'drag','data-person':1},svg); }
    // 鏡（壁にとりつけ。表は右）
    el('rect',{x:-3,y:Y(top),width:3,height:top-bot,fill:'var(--mirror-d)'},svg);
    el('line',{x1:0,y1:Y(bot),x2:0,y2:Y(top),stroke:'var(--mirror)','stroke-width':2.2},svg);
    el('text',{x:-4,y:Y(top)-3,'font-size':6,'font-weight':900,fill:'var(--ink-soft)','text-anchor':'middle'},svg).textContent='鏡';
    // ヒント⑤ 全身に必要な部分
    const n1=eye/2, n2=(H+eye)/2;
    if(lv>=5){ el('line',{x1:4,y1:Y(n1),x2:4,y2:Y(n2),stroke:'var(--ray)','stroke-width':3.2,opacity:.85},svg);
    el('text',{x:7,y:Y((n1+n2)/2),'font-size':6,'font-weight':900,fill:'var(--ray)'},svg).textContent=`全身に必要 ${Math.round(n2-n1)}cm`; }
    // 頭のてっぺん・足先からの光
    const g=el('g',{},svg), E=[dist-personW(H)*(.5-PERSON_SIDE.eyeX),Y(eye)];   // 光は絵の目に届く
    const IE=[-E[0],0];                                               // 像の目と同じたての線
    if(lv>=2) for(const h of [H,0]){                                  // ヒント② 目と、像の頭のてっぺん・足先を結ぶ
      el('line',{x1:E[0],y1:E[1],x2:IE[0],y2:Y(h),stroke:'#9b86d6','stroke-width':.9,'stroke-dasharray':'2.6 1.4'},g);
      el('circle',{cx:0,cy:Y((h+eye)/2),r:1.6,fill:'#7b64c0'},g);
    }
    if(lv>=3) for(const mh of [top,bot]){                             // ヒント③ 目と、鏡の上はし・下はしを結んで、像までのばす
      const hh=2*mh-eye, t=hh<0 ? eye/(eye-hh) : 1;                // 床より下へは引かない
      el('line',{x1:E[0],y1:E[1],x2:E[0]+(IE[0]-E[0])*t,y2:Y(eye+(hh-eye)*t),stroke:'#2f7fd0','stroke-width':.9,'stroke-dasharray':'2.6 1.4'},g);
      if(hh>=0 && hh<=H) el('circle',{cx:IE[0],cy:Y(hh),r:1.8,fill:'#2f7fd0'},g);
    }
    if(lv>=4) for(const [h,mh] of [[H,n2],[0,n1]]){                    // ヒント④ 光の道すじ
      const M=[0,Y(mh)], ok=mh>=bot-1e-9 && mh<=top+1e-9, O=[dist,Y(h)];
      const col=ok?'var(--ray)':'#b9afa2', dash=ok?null:'2 1.6';
      const at={stroke:col,'stroke-width':1.3}; if(dash) at['stroke-dasharray']=dash;
      el('line',{x1:E[0],y1:O[1],x2:M[0],y2:M[1],...at,'marker-end':ok?`url(#arw-${opt.uid})`:''},g);   // 目と同じたての線の、頭のてっぺん・足もとから（反射の法則がずれないように）
      el('line',{x1:M[0],y1:M[1],x2:E[0]-3,y2:E[1]+(M[1]-E[1])*3/E[0],...at,'marker-end':ok?`url(#arw-${opt.uid})`:''},g);
      el('line',{x1:M[0],y1:M[1],x2:-E[0],y2:O[1],stroke:col,'stroke-width':.8,'stroke-dasharray':'2 1.6',opacity:.8},g);
    }
    // 問題の点（ア〜カ）
    const pre=SIDE_PRESET[st.preset];
    if(pre && pre.H===H && pre.eye===eye) for(const [id,h] of pre.pts){
      const seen=lv>=5 && h>=lo-1e-9 && h<=hi+1e-9, x=dist-personW(H)/2-3.5;
      if(seen) el('circle',{cx:x,cy:Y(h),r:3.4,fill:'none',stroke:'var(--ray)','stroke-width':1.4},svg);
      el('circle',{cx:x,cy:Y(h),r:1.8,fill:'#3a3040'},svg);
      el('text',{x:x-4.5,y:Y(h)+2,'font-size':6,'font-weight':900,fill:'var(--ink)','text-anchor':'end'},svg).textContent=id;
    }
    // 距離
    el('line',{x1:0,y1:10,x2:dist,y2:10,stroke:'var(--ink-soft)','stroke-width':.6},svg);
    el('text',{x:dist/2,y:19,'font-size':6,'font-weight':900,fill:'var(--ink-soft)','text-anchor':'middle'},svg).textContent=`${dist}cm`;
    KIND.side._last={lo,hi,n1,n2};
  },
  msg(){
    const {lo,hi,n1,n2}=KIND.side._last, st=ST, pre=SIDE_PRESET[st.preset], lv=st.hint;
    if(lv<5){
      const t=[ `<b>${pre?pre.name:''}</b>　${pre?pre.note:''}`,
        `鏡の向こうに<b>像</b>をかいた。像は、鏡から自分と同じ距離（${st.dist}cm）のところにできる。`,
        '目と、像の頭のてっぺん・足先を結んだ（紫の点線）。この線が鏡の面を通るところ（紫の●）の<b>あいだに鏡があれば</b>、全身がうつる。',
        '目と、鏡の上はし・下はしを結んで、像までのばした（青の点線）。像のうち、<b>青の●のあいだ</b>が鏡にうつって見える。',
        '頭のてっぺん・足先から出た光が、鏡ではね返って目に届く道すじ。鏡のないところに当たる光（灰色の点線）は、目に届かない。' ][lv];
      document.getElementById('msg').innerHTML=t; return;
    }
    let html = hi>lo ? `鏡にうつって見えるのは、床から <b>${Math.round(lo)}cm 〜 ${Math.round(hi)}cm</b> の部分。`
                     : '鏡には、自分のすがたがうつらない。';
    if(hi>lo && 2*st.top-st.eye>st.H) html += `（頭の上 ${Math.round(2*st.top-st.eye-st.H)}cm まで、まわりもうつる）`;
    html += `<br>全身をうつすには、鏡の <b>${Math.round(n1)}cm 〜 ${Math.round(n2)}cm</b>（${Math.round(n2-n1)}cm）があればよい。`;
    if(pre && pre.H===st.H && pre.eye===st.eye && pre.pts.length){
      const seen=pre.pts.filter(([,h])=>h>=lo-1e-9&&h<=hi+1e-9).map(([id])=>id);
      html += `<br>うつる点：<b>${seen.join('・')||'なし'}</b>`;
    }
    if(pre) html += `<div class="hintline">${pre.name}：${pre.note}</div>`;
    document.getElementById('msg').innerHTML=html;
  },
  down(e){
    const t=e.target.closest('[data-person]'); if(!t) return;
    e.preventDefault(); fig.setPointerCapture(e.pointerId);
    drag={ custom:ev=>{ const p=fig.createSVGPoint(); p.x=ev.clientX; p.y=ev.clientY; const q=p.matrixTransform(fig.getScreenCTM().inverse());
      ST.dist=Math.max(30,Math.min(250,Math.round(q.x/5)*5)); syncSliders(); render(); }};
  }
};

buildHome();
function fromHash(){ const [id,preset]=decodeURIComponent(location.hash.slice(1)).split(':'); if(PROBLEMS.some(p=>p.id===id&&(p.cols||p.kind))) openLab(id, preset&&SIDE_PRESET[preset]?{preset}:{}); }
fromHash(); addEventListener('hashchange',fromHash);
window.__kagami={PROBLEMS,seenVia,reflect,side,get ST(){return ST;},openLab,render};
</script>
